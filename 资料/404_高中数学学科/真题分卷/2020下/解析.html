<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2020下半年 · 高中数学教资 · 解析</title>
<style>
  :root{
    --pink:#e5487c; --pink-bg:#fdeef4; --blue:#2b7de9; --blue-bg:#eaf3fe;
    --gold:#b26a00; --gold-bg:#fff7e0; --ink:#2b2b33; --gray:#8a8f98; --line:#e8e8ee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#f2f3f7;color:var(--ink);
       font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
       line-height:1.85;font-size:16px}
  .wrap{max-width:860px;margin:0 auto;padding:28px 18px 60px}
  header.top{background:linear-gradient(135deg,#e5487c,#8a4bd8);color:#fff;border-radius:16px;
       padding:26px 28px;margin-bottom:22px;box-shadow:0 6px 18px rgba(138,75,216,.25)}
  header.top h1{margin:0 0 6px;font-size:24px}
  header.top p{margin:0;opacity:.92;font-size:14px}
  .chips{margin-top:14px}
  .chip{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
       border-radius:999px;padding:3px 14px;margin:0 8px 8px 0;font-size:13px}
  .chip b{color:#ffe08a}
  section.card{background:#fff;border-radius:16px;padding:24px 26px;margin-bottom:20px;
       box-shadow:0 2px 10px rgba(30,30,60,.07)}
  .qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .qhead h2{font-size:19px;margin:0}
  .badge{border-radius:8px;padding:2px 12px;font-size:13px;font-weight:600;white-space:nowrap}
  .b-lun{background:var(--pink);color:#fff}
  .b-jie{background:#5b8def;color:#fff}
  .b-an{background:#f08c00;color:#fff}
  .b-she{background:#0ca678;color:#fff}
  .b-wait{background:#ececf1;color:#8a8f98}
  .score{color:var(--pink);font-weight:700;font-size:14px}
  .origin{background:#f7f7fa;border-left:4px solid #b9bdc9;border-radius:8px;
       padding:12px 16px;color:#555;font-size:15px;margin:12px 0}
  .block{border-radius:12px;padding:14px 18px;margin:14px 0}
  .block h3{margin:0 0 8px;font-size:15px;letter-spacing:.5px}
  .k-bibei{background:var(--pink-bg);border:1px solid #f6c3d6}
  .k-bibei h3{color:var(--pink)}
  .k-blue{background:var(--blue-bg);border:1px solid #c4dcf8}
  .k-blue h3{color:var(--blue)}
  .k-gold{background:var(--gold-bg);border:1px solid #f3d9a0}
  .k-gold h3{color:var(--gold)}
  .line{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:6px;
       color:#98a0ab;font-size:12px;padding:0 7px;margin-right:6px;font-family:Menlo,monospace}
  a{color:#1971c2;text-decoration:underline;text-underline-offset:3px}
  a span.line{color:#868e96}
  mark{background:#d0ebff;color:#1971c2;padding:0 3px;border-radius:4px}
  .pk{color:var(--pink);font-weight:700}
  .bl{color:var(--blue)}
  .ex{background:#fff3bf;border-radius:8px;padding:2px 8px;color:#9a7b00}
  .points{list-style:none;padding-left:4px}
  .points>li{margin:10px 0}
  .points .pt{font-weight:700;color:var(--pink)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .mini{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
  .mini h4{margin:0 0 6px;font-size:14px;color:var(--blue)}
  ul.tips{margin:6px 0;padding-left:20px}
  ul.tips li{margin:6px 0}
  .wait{color:#9aa0aa;text-align:center;padding:10px 0;font-size:14px}
  footer{color:#9aa0aa;font-size:13px;text-align:center;margin-top:26px}
  .t-full{background:#eef6ff;border:1px solid #b6d6f7}
  .t-full h3{color:#1971c2}
  .t-exam{background:#e9f9ef;border:1px solid #b2e2c5}
  .t-exam h3{color:#2b8a3e}
  .t-life{background:#ffecec;border:1px solid #ffc9c9}
  .t-life h3{color:#c92a2a}
  @media print{
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    section.card{box-shadow:none;border:1px solid #eee;break-inside:avoid}
    header.top{box-shadow:none}
  }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1>2020年下半年 · 《高中数学》真题解析</h1>
  <p>教师资格证 · 科目三</p>
  <div class="chips">
    <span class="chip">解答题 9–14 · <b>待补</b></span>
    <span class="chip">四 论述题 15 · ✅ 已解析</span>
    <span class="chip">五 案例分析 16 · <b>待补</b></span>
    <span class="chip">六 教学设计 17 · <b>待补</b></span>
  </div>
</header>

<section class="card">
  <div class="qhead"><h2>📑 解析目录 · 点卡片进单题页</h2></div>
  <div class="grid">
    <a class="mini" style="display:block;text-decoration:none;color:inherit" href="q15.html">
      <h4 style="color:#2b8a3e">四、论述题 · 第15题 · 数据分析能力的意义 · 15分</h4>
      ✅ 已解析：推导＋课标链接＋三档全稿＋技巧＋出处</a>
    <div class="mini"><h4>二、解答题 9–14 · 学科知识</h4><span class="wait" style="padding:0">待补</span></div>
    <div class="mini"><h4>五、案例分析 · 第16题 · 20分</h4><span class="wait" style="padding:0">待补</span></div>
    <div class="mini"><h4>六、教学设计 · 第17题 · 30分</h4><span class="wait" style="padding:0">待补</span></div>
  </div>
</section>

<footer>本页为目录 ｜ 单题讲义在 qXX.html（内置打印样式）</footer>
</div>
</body>
</html>
